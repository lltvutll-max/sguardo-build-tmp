# XcodeGen: .xcodeproj генерится из этого файла (`xcodegen generate`), в репозитории не хранится.
# Временный слот: bundle id и запись App Store Connect от Fewls (dev.disify.batch), с разрешения владельца.
name: Sguardo
options:
  bundleIdPrefix: dev.disify
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # язык исходных строк (ключи String Catalog — русские); фолбэк для неподдерживаемых языков — en (CFBundleDevelopmentRegion в Info.plist)
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Sguardo:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: dev.disify.batch
        PRODUCT_NAME: Sguardo
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Sguardo:
    build:
      targets:
        Sguardo: all
    archive:
      config: Release
